name: Release

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to merge and release'
        required: true
        type: string
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options: [minor, patch, major]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify PR is open and targets main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          state=$(gh pr view "$PR" --json state,baseRefName,isDraft -q '.state + " " + .baseRefName + " " + (.isDraft|tostring)')
          echo "PR state: $state"
          read -r s base draft <<< "$state"
          [ "$s" = "OPEN" ]     || { echo "::error::PR #$PR is $s, not OPEN"; exit 1; }
          [ "$base" = "main" ]  || { echo "::error::PR #$PR targets $base, not main"; exit 1; }
          [ "$draft" = "false" ]|| { echo "::error::PR #$PR is a draft"; exit 1; }

      - name: Require unit and E2E to have passed on the head commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          echo "Head commit: $sha"

          runs=$(gh api "repos/$REPO/commits/$sha/check-runs" --paginate \
                   --jq '.check_runs[] | {name, status, conclusion}' | jq -s '.')
          echo "$runs" | jq -r '.[] | "  \(.name): \(.status)/\(.conclusion // "-")"' | sort

          # editing a PR description re-runs the workflow with unit and E2E
          # skipped, so the newest run is not evidence; require a success for
          # each job somewhere on this commit, and refuse while any still runs
          running=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
          if [ "$running" -ne 0 ]; then
            echo "::error::$running check(s) still running on $sha; wait for them and re-run"
            exit 1
          fi

          for job in unit e2e; do
            ok=$(echo "$runs" | jq --arg j "$job" \
                 '[.[] | select(.name == $j and .conclusion == "success")] | length')
            if [ "$ok" -eq 0 ]; then
              echo "::error::'$job' has no successful run on $sha; push a fix or re-run CI"
              exit 1
            fi
            echo "$job: passed"
          done

          failed=$(echo "$runs" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled")] | length')
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed check(s) failed on $sha"
            exit 1
          fi

      - name: Extract release notes from PR description
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          body=$(gh pr view "$PR" --json body -q .body)

          # everything under "## What changed" up to the next heading
          what=$(printf '%s' "$body" | awk '
            /^## What changed/ { grab=1; next }
            /^## / { grab=0 }
            grab { print }
          ' | sed '/^<!--/d' | sed 's/[[:space:]]*$//')
          what=$(printf '%s' "$what" | sed '/^$/d')

          if [ -z "$what" ]; then
            echo "::error::PR #$PR has an empty 'What changed' section; fill it in and re-run"
            exit 1
          fi

          # bullets from "## Changes", used as the changelog body
          changes=$(printf '%s' "$body" | awk '
            /^## Changes/ { grab=1; next }
            /^## / { grab=0 }
            grab { print }
          ' | grep '^- ' || true)

          if [ -z "$changes" ]; then
            echo "::error::PR #$PR has no bullets under '## Changes'; fill it in and re-run"
            exit 1
          fi

          {
            echo 'changes<<CHANGELOG_EOF'
            printf '%s\n' "$changes"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        run: |
          current=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "Bumping $current -> $next"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Merge the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          gh pr merge "$PR" --merge --delete-branch
          git fetch origin main
          git reset --hard origin/main

      - name: Apply version bump and changelog
        env:
          NEXT: ${{ steps.version.outputs.next }}
          CHANGES: ${{ steps.notes.outputs.changes }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.env.NEXT;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

          date=$(date -u +%Y-%m-%d)
          printf '## [%s] - %s\n\n### Added\n%s\n\n' "$NEXT" "$date" "$CHANGES" > /tmp/entry.md

          # split at the first release heading and splice the new entry between,
          # avoiding a multiline awk -v (which BSD awk rejects)
          first=$(grep -n '^## \[' CHANGELOG.md | head -1 | cut -d: -f1)
          head -n "$((first - 1))" CHANGELOG.md  > /tmp/CHANGELOG.md
          cat /tmp/entry.md                     >> /tmp/CHANGELOG.md
          tail -n "+$first" CHANGELOG.md        >> /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md CHANGELOG.md

          head -30 CHANGELOG.md

      - name: Commit, tag and push
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json CHANGELOG.md
          git commit -m "chore: release v$NEXT"
          git tag "v$NEXT"
          git push origin main --follow-tags

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
          CHANGES: ${{ steps.notes.outputs.changes }}
        run: |
          printf '### Added\n%s\n' "$CHANGES" > /tmp/notes.md
          gh release create "v$NEXT" --title "v$NEXT" --notes-file /tmp/notes.md
          echo "Released v$NEXT" >> "$GITHUB_STEP_SUMMARY"
          gh release view "v$NEXT" --json url -q .url >> "$GITHUB_STEP_SUMMARY"
